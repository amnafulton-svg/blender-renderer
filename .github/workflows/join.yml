name: join
# Make the MP4 from the frames of an earlier render run (no re-render).
on:
  workflow_dispatch:
    inputs:
      run_id: {description: "render run id", required: true}
      fps: {description: "frames per second", default: "25"}
permissions:
  actions: read
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "frames-*"
          path: all
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Encode
        run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          ls all/*.png | wc -l
          ffmpeg -loglevel error -y -framerate ${{ inputs.fps }} -i all/f_%04d.png -c:v libx264 -crf 18 -pix_fmt yuv420p video.mp4
          ls -la video.mp4
      - uses: actions/upload-artifact@v4
        with: {name: "video", path: video.mp4, retention-days: 14}
